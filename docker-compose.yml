services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: trip_planner
      MYSQL_USER: trip_planner
      MYSQL_PASSWORD: trip_planner_dev
      MYSQL_ROOT_PASSWORD: root_dev_only_change_me
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_only_change_me"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
